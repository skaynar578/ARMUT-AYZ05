
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Panel</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0a0a0a;
    color:white;
}

header{
    background:black;
    padding:20px;
    text-align:center;
    color:gold;
    font-size:22px;
}

.container{
    padding:20px;
    text-align:center;
}

.card{
    background:#111;
    margin:15px auto;
    padding:20px;
    width:80%;
    border-radius:10px;
}

.btn{
    display:inline-block;
    padding:10px 15px;
    background:gold;
    color:black;
    text-decoration:none;
    border-radius:6px;
    margin-top:10px;
}
</style>
</head>

<body>

<header>
ARMUT-AYZ PANEL
</header>

<div class="container">

<h2 id="welcome">Hoş Geldin 👋</h2>

<div class="card">
<h3>Sunucu Durumu</h3>
<p>Aktif Oyuncular: 100</p>
</div>

<div class="card">
<h3>Etkinlikler</h3>
<p>Haftalık turnuvalar aktif</p>
</div>

<div class="card">
<a class="btn" href="index.html">Ana Sayfa</a>
</div>

</div>

<script>
// giriş yapan kullanıcıyı göster
let user = localStorage.getItem("user");
if(user){
    document.getElementById("welcome").innerText = "Hoş Geldin " + user + " 👋";
}
</script>

</body>
</html>
