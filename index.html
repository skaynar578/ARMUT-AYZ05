<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARMUT-AYZ</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0a0a0a;
    color:white;
}

/* SOL ÜST DESTEK */
.destek{
    position:fixed;
    top:10px;
    left:10px;
    text-align:left;
    font-size:14px;
}

.destek a{
    display:block;
    margin-top:5px;
    color:#5865F2;
    text-decoration:none;
}

/* HEADER */
header{
    background:black;
    padding:20px;
    text-align:center;
    color:gold;
    font-size:22px;
}

.hero{
    text-align:center;
    padding:70px 20px;
}

.btn{
    display:inline-block;
    padding:12px 20px;
    margin:10px;
    background:gold;
    color:black;
    text-decoration:none;
    border-radius:6px;
    font-weight:bold;
}

.box{
    text-align:center;
    margin-top:30px;
}

input{
    padding:10px;
    width:70%;
    text-align:center;
    font-size:16px;
}

button{
    margin-top:10px;
    padding:10px;
    background:gold;
    border:none;
    font-weight:bold;
    cursor:pointer;
}

.linkler{
    margin-top:20px;
}

.linkler a{
    display:block;
    margin:10px auto;
    padding:10px;
    width:220px;
    text-align:center;
    border-radius:8px;
    text-decoration:none;
    font-weight:bold;
}

.discord{
    background:#5865F2;
    color:white;
}

.kick{
    background:#53FC18;
    color:black;
}

.sayac{
    margin-top:20px;
    font-size:18px;
    color:#ccc;
}
</style>
</head>

<body>

<!-- SOL ÜST DESTEK -->
<div class="destek">
    <strong>DESTEK</strong>
    <a href="https://discord.gg/kEWaZdWN" target="_blank">
        Discord'a Katıl
    </a>
</div>

<header>
ARMUT-AYZ GAMING PLATFORM
</header>

<div class="hero">

<h1>Çok Oyunculu Platform</h1>
<p>En iyi oyun deneyimine katıl</p>

<a class="btn" href="giris.html">Giriş Yap</a>
<a class="btn" href="kayit.html">Kayıt Ol</a>

<!-- LINKLER -->
<div class="linkler">
    <a href="https://discord.gg/kEWaZdWN" target="_blank" class="discord">
        Discord'a Katıl
    </a>

    <a href="https://kick.com/ayazayz" target="_blank" class="kick">
        Kick Yayını İzle
    </a>
</div>

<!-- ZİYARETÇİ -->
<div class="sayac">
    Toplam Ziyaretçi: <span id="sayac">0</span>
</div>

<!-- IP -->
<div class="box">

<input id="ip" value="Armusmpt.aternos.me" readonly>

<br>

<button onclick="kopyala()">KOPYALA</button>

</div>

</div>

<script>
function kopyala(){
    let ip = document.getElementById("ip");
    ip.select();
    ip.setSelectionRange(0, 99999);
    document.execCommand("copy");
    alert("Kopyalandı: " + ip.value);
}

let sayi = localStorage.getItem("ziyaretci");

if(sayi){
    sayi = Number(sayi) + 1;
}else{
    sayi = 1;
}

localStorage.setItem("ziyaretci", sayi);
document.getElementById("sayac").innerText = sayi;
</script>

</body>
</html>
