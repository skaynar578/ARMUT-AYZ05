<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Giriş - ARMUT-AYZ</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:linear-gradient(135deg,#000,#111);
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.box{
    background:#111;
    padding:30px;
    border-radius:12px;
    width:300px;
    box-shadow:0 0 20px black;
    text-align:center;
}

h1{
    color:gold;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:10px;
    margin:10px 0;
    border:none;
    border-radius:6px;
}

button{
    width:100%;
    padding:10px;
    background:gold;
    border:none;
    border-radius:6px;
    cursor:pointer;
    font-weight:bold;
}

button:hover{
    background:#ffcc00;
}

a{
    color:gold;
    display:block;
    margin-top:10px;
    text-decoration:none;
}
</style>

</head>

<body>

<div class="box">
<h1>GİRİŞ</h1>

<input type="text" placeholder="Kullanıcı adı">
<input type="password" placeholder="Şifre">

<button onclick="giris()">Giriş Yap</button>

<a href="index.html">← Ana Sayfa</a>
</div>

<script>
function giris(){
    alert("Giriş başarılı (demo)");
    window.location.href = "index.html";
}
</script>

</body>
</html>
