<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Giriş</title>

<style>
body{
    margin:0;
    background:#0a0a0a;
    color:white;
    font-family:Arial;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.box{
    background:#111;
    padding:25px;
    border-radius:10px;
    width:300px;
    text-align:center;
}

input{
    width:100%;
    padding:10px;
    margin:8px 0;
}

button{
    width:100%;
    padding:10px;
    background:gold;
    border:none;
    cursor:pointer;
    font-weight:bold;
}

a{
    color:gold;
    display:block;
    margin-top:10px;
}
</style>
</head>

<body>

<div class="box">
<h2>GİRİŞ</h2>

<input id="kadi" placeholder="Kullanıcı adı">
<input id="sifre" type="password" placeholder="Şifre">

<button onclick="login()">Giriş Yap</button>

<a href="index.html">← Ana Sayfa</a>
</div>

<script>
function login(){
    let k = document.getElementById("kadi").value;
    let s = document.getElementById("sifre").value;

    let savedK = localStorage.getItem("user");
    let savedS = localStorage.getItem("pass");

    if(k === "" || s === ""){
        alert("Doldur");
        return;
    }

    if(k === savedK && s === savedS){
        window.location.href = "panel.html";
    } else {
        alert("Hatalı giriş");
    }
}
</script>

</body>
</html>
